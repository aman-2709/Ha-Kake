# Opt-in: let the container read the OTA status file a host process writes
# (docs/OTA.md, tools/ota_export.py). Not installed by default, because a bind
# mount whose host directory does not exist stops the unit from starting.
#
# Install it beside the unit (docs/CONTAINER.md, "Showing what the board is running"):
#   sudo install -d -m 0755 /var/lib/vehicletap-ota
#   sudo install -d /etc/containers/systemd/vehicletap.container.d
#   sudo cp 10-ota.conf /etc/containers/systemd/vehicletap.container.d/
#
# The directory is mounted, not the file: the exporter replaces the file
# atomically, which gives it a new inode, and a single-file mount would keep
# showing the old one. Read-only: the container never writes it. The `z`
# relabels the host directory so SELinux lets the container read it; that is
# untested on a board.
[Container]
Volume=/var/lib/vehicletap-ota:/ota:ro,z
Environment=VEHICLETAP_OTA_FILE=/ota/ota_status.json
